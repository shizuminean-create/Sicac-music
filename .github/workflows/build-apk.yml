name: Build SICAC Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Diagnose YouTube API key
        env:
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: |
          if [ -z "$VITE_YOUTUBE_API_KEY" ]; then
            echo "::error::GitHub Secret VITE_YOUTUBE_API_KEY kosong atau belum tersedia."
            exit 1
          fi

          echo "GitHub Secret tersedia."
          echo "Panjang key: ${#VITE_YOUTUBE_API_KEY} karakter."

          node <<'NODE'
          async function main() {
            const key = process.env.VITE_YOUTUBE_API_KEY;
            const url = new URL(
              'https://www.googleapis.com/youtube/v3/search'
            );

            url.searchParams.set('part', 'snippet');
            url.searchParams.set('type', 'video');
            url.searchParams.set('maxResults', '1');
            url.searchParams.set('q', 'test');
            url.searchParams.set('key', key);

            try {
              const response = await fetch(url);
              const data = await response.json();

              if (response.ok && data.items) {
                console.log('YouTube API test: BERHASIL');
                return;
              }

              console.log('YouTube API test: GAGAL');
              console.log('HTTP status:', response.status);
              console.log(
                'Alasan:',
                data.error?.errors?.[0]?.reason || 'tidak diketahui'
              );
              console.log(
                'Pesan:',
                data.error?.message || 'tidak ada pesan'
              );
              process.exitCode = 1;
            } catch (error) {
              console.log('Tes jaringan gagal:', error.message);
              process.exitCode = 1;
            }
          }

          main();
          NODE

      - name: Build web app
        env:
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: npm run build

      - name: Verify web build
        run: |
          test -d dist || {
            echo "::error::Folder dist tidak ditemukan."
            exit 1
          }
          echo "Isi folder dist:"
          find dist -maxdepth 2 -type f | head -100

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SICAC-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
