
name: Build SICAC Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sicac-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Ambil source code
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # 3. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      # 5. Install dependencies
      - name: Install npm dependencies
        run: npm install

      # 6. Build React / Vite
      - name: Build web app
        run: npm run build

      # 7. Buat project Android jika belum ada
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 8. Generate icon Android
      - name: Install Capacitor Assets
        run: npm install --save-dev @capacitor/assets

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      # 9. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 10. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 11. Build APK Debug
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SICAC-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

