name: Build SICAC Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build SICAC Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Capacitor configuration
        run: |
          node -e "
            const p = require('./package.json');
            console.log('Project:', p.name);
            console.log('Capacitor CLI:', p.dependencies?.['@capacitor/cli'] || p.devDependencies?.['@capacitor/cli'] || 'not declared');
            console.log('Capacitor Android:', p.dependencies?.['@capacitor/android'] || p.devDependencies?.['@capacitor/android'] || 'not declared');
          "

      - name: Build web app
        env:
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: npm run build

      - name: Verify web build
        run: |
          test -d dist || {
            echo "::error::Folder dist tidak ditemukan."
            exit 1
          }

          test -f dist/index.html || {
            echo "::error::dist/index.html tidak ditemukan."
            exit 1
          }

          echo "Web build berhasil."
          find dist -maxdepth 2 -type f | head -100

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.mjs ] && \
             [ ! -f capacitor.config.cjs ]; then
            echo "::error::Konfigurasi Capacitor tidak ditemukan."
            exit 1
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/gradlew || {
            echo "::error::android/gradlew tidak ditemukan."
            exit 1
          }

          test -f android/app/build.gradle || \
          test -f android/app/build.gradle.kts || {
            echo "::error::Konfigurasi Gradle aplikasi Android tidak ditemukan."
            exit 1
          }

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SICAC-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
