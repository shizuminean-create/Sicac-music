<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SICAC Admin — Posting Anime</title>
<style>
:root{--bg:#14112A;--panel:#1B1736;--line:rgba(255,255,255,.12);--ac:#C34466;--soft:#FF8FAE;--dim:rgba(255,255,255,.55)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(20,17,42,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:16px 0 8px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;padding:18px;max-width:1100px;margin:auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:10px}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--soft);outline-offset:1px}
select option{color:#000}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:9px 14px;color:#fff;background:rgba(255,255,255,.1)}
button.pri{background:var(--ac);font-weight:700}
button.del{background:rgba(239,68,68,.2);color:#FCA5A5}
.ep{display:grid;grid-template-columns:64px 1fr 2fr 36px;gap:6px;margin-bottom:6px}
.ep input{margin:0;padding:8px}.ep button{padding:0}
.item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item img,.item .ph{width:54px;height:78px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.08);flex-shrink:0}
.item .t{font-weight:700}.item .m{color:var(--dim);font-size:12.5px;margin:2px 0 8px}
.item button{padding:6px 11px;font-size:12.5px;margin-right:6px}
.empty{color:var(--dim);text-align:center;padding:30px 10px}
@media(max-width:480px){.ep{grid-template-columns:52px 1fr 36px}.ep input:nth-child(3){grid-column:1/-1;grid-row:2}.ep button{grid-column:3;grid-row:1}}
</style>
</head>
<body>
<header>
  <h1>SICAC Admin <span id="count" style="color:var(--dim);font-weight:400"></span></h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="imp">Impor</button>
    <button class="pri" id="exp">Ekspor catalog.json</button>
    <input type="file" id="impf" accept="application/json,.json" hidden>
  </div>
</header>
<main>
  <section>
    <h2 id="ft">Posting anime baru</h2>
    <form id="f" autocomplete="off">
      <label>Judul<input id="title" required></label>
      <label>Sinopsis<textarea id="syn" rows="4"></textarea></label>
      <label>Poster (URL atau unggah gambar)<input id="poster" placeholder="https://..."><input type="file" id="pf" accept="image/*" style="margin-top:6px"></label>
      <div class="row">
        <label>Genre (pisah koma)<input id="genres" placeholder="Aksi, Fantasi"></label>
        <label>Tahun<input id="year" type="number" min="1900" max="2100"></label>
      </div>
      <label>Status<select id="status"><option>Berjalan</option><option>Tamat</option></select></label>
      <h3>Episode</h3>
      <div id="eps"></div>
      <button type="button" id="addEp">+ Episode</button>
      <div class="row" style="margin-top:16px">
        <button class="pri" type="submit">Simpan</button>
        <button type="button" id="cancel" hidden>Batal edit</button>
      </div>
    </form>
  </section>
  <section>
    <h2>Anime yang sudah diposting</h2>
    <div id="list"></div>
  </section>
</main>
<script>
const K="sicac.admin.catalog",$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db;try{db=JSON.parse(localStorage.getItem(K))}catch{}
if(!db||!Array.isArray(db.anime))db={anime:[]};
let editing=null,eps=[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch{alert("Penyimpanan browser penuh. Ekspor catalog.json sekarang, lalu pakai poster berupa URL.")}};

function drawEps(){
  $("#eps").innerHTML=eps.map((e,i)=>`<div class="ep">
    <input type="number" step="any" min="0" value="${esc(e.n)}" data-i="${i}" data-k="n" placeholder="No" aria-label="Nomor episode">
    <input value="${esc(e.title)}" data-i="${i}" data-k="title" placeholder="Judul (opsional)" aria-label="Judul episode">
    <input value="${esc(e.url)}" data-i="${i}" data-k="url" placeholder="URL video (.mp4 / .m3u8 / embed)" aria-label="URL video">
    <button type="button" class="del" data-del="${i}" aria-label="Hapus episode">✕</button></div>`).join("");
}
function drawList(){
  $("#count").textContent=db.anime.length?`· ${db.anime.length} anime`:"";
  $("#list").innerHTML=db.anime.length?db.anime.map(a=>`<div class="item">
    ${a.poster?`<img src="${esc(a.poster)}" alt="">`:`<div class="ph"></div>`}
    <div><div class="t">${esc(a.title)}</div>
    <div class="m">${a.episodes.length} episode · ${esc(a.status)}${a.year?" · "+esc(a.year):""}</div>
    <button data-edit="${esc(a.id)}">Edit</button><button class="del" data-rm="${esc(a.id)}">Hapus</button></div></div>`).join("")
    :`<div class="empty">Belum ada anime. Isi formulir lalu tekan Simpan.</div>`;
}
function reset(){editing=null;eps=[];$("#f").reset();$("#ft").textContent="Posting anime baru";$("#cancel").hidden=true;drawEps()}

$("#eps").addEventListener("input",e=>{const t=e.target;if(t.dataset.k)eps[t.dataset.i][t.dataset.k]=t.value});
$("#eps").addEventListener("click",e=>{const i=e.target.dataset.del;if(i!=null){eps.splice(i,1);drawEps()}});
$("#addEp").onclick=()=>{eps.push({n:Math.max(0,...eps.map(e=>+e.n||0))+1,title:"",url:""});drawEps()};
$("#cancel").onclick=reset;

$("#pf").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const w=Math.min(400,img.width),c=document.createElement("canvas");c.width=w;c.height=Math.round(img.height*w/img.width);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);$("#poster").value=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(u)};
  img.src=u;
};

$("#f").onsubmit=e=>{
  e.preventDefault();
  const title=$("#title").value.trim();if(!title)return;
  const episodes=eps.filter(x=>x.url.trim()&&x.n!==""&&!isNaN(+x.n)).map(x=>({n:+x.n,title:x.title.trim(),url:x.url.trim()})).sort((a,b)=>a.n-b.n);
  const a={id:editing||(title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"anime")+"-"+Math.random().toString(36).slice(2,6),
    title,synopsis:$("#syn").value.trim(),poster:$("#poster").value.trim(),
    genres:$("#genres").value.split(",").map(s=>s.trim()).filter(Boolean),status:$("#status").value,year:+$("#year").value||null,episodes};
  const i=db.anime.findIndex(x=>x.id===a.id);
  if(i>=0)db.anime[i]=a;else db.anime.unshift(a);
  save();drawList();reset();
};

$("#list").onclick=e=>{
  const ed=e.target.dataset.edit,rm=e.target.dataset.rm;
  if(ed){const a=db.anime.find(x=>x.id===ed);if(!a)return;editing=a.id;eps=a.episodes.map(x=>({...x}));
    $("#title").value=a.title;$("#syn").value=a.synopsis||"";$("#poster").value=a.poster||"";$("#genres").value=(a.genres||[]).join(", ");
    $("#year").value=a.year||"";$("#status").value=a.status||"Berjalan";$("#ft").textContent="Edit: "+a.title;$("#cancel").hidden=false;drawEps();scrollTo({top:0,behavior:"smooth"})}
  if(rm&&confirm("Hapus anime ini dari katalog?")){db.anime=db.anime.filter(x=>x.id!==rm);if(editing===rm)reset();save();drawList()}
};

$("#exp").onclick=()=>{
  const u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
  const a=document.createElement("a");a.href=u;a.download="catalog.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
};
$("#imp").onclick=()=>$("#impf").click();
$("#impf").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.anime))throw 0;
    db={anime:d.anime.map(a=>({...a,episodes:a.episodes||[],genres:a.genres||[]}))};save();drawList();reset()}
  catch{alert("File tidak valid. Gunakan catalog.json hasil ekspor.")}
};
drawList();drawEps();
</script>
</body>
</html>
